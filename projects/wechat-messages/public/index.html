<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微信消息监控</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    /* 左侧群组列表 */
    .sidebar {
      width: 320px;
      background: #141414;
      border-right: 1px solid #222;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }

    .add-group-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #2d2d2d;
      border: none;
      color: #888;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .add-group-btn:hover {
      background: #3d3d3d;
      color: #fff;
    }

    .group-list {
      flex: 1;
      overflow-y: auto;
    }

    .group-item {
      padding: 16px 20px;
      cursor: pointer;
      border-bottom: 1px solid #1a1a1a;
      transition: background 0.2s;
    }

    .group-item:hover {
      background: #1a1a1a;
    }

    .group-item.active {
      background: #1f1f1f;
      border-left: 3px solid #667eea;
    }

    .group-name {
      font-size: 15px;
      font-weight: 500;
      color: #fff;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .group-count {
      font-size: 12px;
      color: #666;
      background: #2a2a2a;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .group-preview {
      font-size: 13px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .group-time {
      font-size: 11px;
      color: #555;
      margin-top: 4px;
    }

    .delete-group-btn {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      padding: 4px 8px;
      font-size: 12px;
      opacity: 0;
      transition: all 0.2s;
    }

    .group-item:hover .delete-group-btn {
      opacity: 1;
    }

    .delete-group-btn:hover {
      color: #e74c3c;
    }

    /* 右侧消息区域 */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0d0d0d;
    }

    .main-header {
      padding: 20px 24px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .main-header h2 {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }

    .message-count {
      font-size: 13px;
      color: #666;
    }

    .message-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
    }

    .message-item {
      display: flex;
      gap: 12px;
      padding: 10px 0;
    }

    .message-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 16px;
      flex-shrink: 0;
      font-weight: 500;
    }

    .message-body {
      flex: 1;
      min-width: 0;
    }

    .message-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .message-sender {
      font-weight: 500;
      color: #fff;
      font-size: 14px;
    }

    .message-time {
      color: #555;
      font-size: 12px;
    }

    .message-content {
      background: #1e1e1e;
      padding: 10px 14px;
      border-radius: 0 12px 12px 12px;
      color: #e0e0e0;
      display: inline-block;
      max-width: 85%;
      line-height: 1.6;
      word-break: break-word;
      font-size: 14px;
    }

    .load-more-btn {
      display: block;
      margin: 20px auto;
      padding: 10px 32px;
      background: transparent;
      border: 1px solid #333;
      color: #888;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .load-more-btn:hover {
      border-color: #555;
      color: #aaa;
    }

    .load-more-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 空状态 */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #444;
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    .empty-state-text {
      font-size: 16px;
    }

    /* 模态框 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 24px;
      width: 400px;
      max-width: 90%;
    }

    .modal h3 {
      font-size: 18px;
      margin-bottom: 16px;
      color: #fff;
    }

    .modal input {
      width: 100%;
      padding: 12px 16px;
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .modal input:focus {
      outline: none;
      border-color: #667eea;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .modal-btn {
      padding: 10px 24px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .modal-btn.cancel {
      background: #2d2d2d;
      color: #888;
    }

    .modal-btn.cancel:hover {
      background: #3d3d3d;
    }

    .modal-btn.confirm {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }

    .modal-btn.confirm:hover {
      opacity: 0.9;
    }

    /* 滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 左侧群组列表 -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h1>💬 群聊列表</h1>
        <button class="add-group-btn" onclick="showAddGroupModal()">+</button>
      </div>
      <div class="group-list" id="groupList">
        <!-- 动态加载 -->
      </div>
    </div>

    <!-- 右侧消息区域 -->
    <div class="main">
      <div class="main-header" id="mainHeader" style="display: none;">
        <h2 id="currentGroupName">群名称</h2>
        <span class="message-count" id="messageCount">0 条消息</span>
      </div>
      <div class="message-list" id="messageList">
        <div class="empty-state" id="emptyState">
          <div class="empty-state-icon">📭</div>
          <div class="empty-state-text">选择一个群组查看消息</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 添加群组模态框 -->
  <div class="modal-overlay" id="addGroupModal">
    <div class="modal">
      <h3>创建新群组</h3>
      <input type="text" id="newGroupName" placeholder="输入群组名称" />
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="hideAddGroupModal()">取消</button>
        <button class="modal-btn confirm" onclick="createGroup()">创建</button>
      </div>
    </div>
  </div>

  <script>
    let currentGroupId = null;
    let currentPage = 1;
    let hasMore = false;

    // 加载群组列表
    async function loadGroups() {
      const res = await fetch('/api/groups');
      const groups = await res.json();
      const list = document.getElementById('groupList');
      
      if (groups.length === 0) {
        list.innerHTML = `
          <div class="empty-state" style="height: 200px;">
            <div class="empty-state-icon">📋</div>
            <div class="empty-state-text">暂无群组</div>
          </div>
        `;
        return;
      }
      
      list.innerHTML = groups.map(g => `
        <div class="group-item ${g.id === currentGroupId ? 'active' : ''}" onclick="selectGroup('${g.id}')">
          <div class="group-name">
            <span>${escapeHtml(g.name)}</span>
            <span class="group-count">${g.message_count}</span>
          </div>
          <div class="group-preview">${escapeHtml(g.latest_message) || '暂无消息'}</div>
          <div class="group-time" style="display: flex; justify-content: space-between; align-items: center;">
            <span>${g.latest_time}</span>
            <button class="delete-group-btn" onclick="event.stopPropagation(); deleteGroup('${g.id}', '${escapeHtml(g.name)}')">删除</button>
          </div>
        </div>
      `).join('');
    }

    // 选择群组
    async function selectGroup(groupId) {
      currentGroupId = groupId;
      currentPage = 1;
      document.getElementById('mainHeader').style.display = 'flex';
      document.getElementById('emptyState').style.display = 'none';
      
      // 更新选中状态
      document.querySelectorAll('.group-item').forEach(el => el.classList.remove('active'));
      event.currentTarget?.classList.add('active');
      
      await loadMessages();
    }

    // 加载消息
    async function loadMessages(append = false) {
      const res = await fetch(`/api/groups/${currentGroupId}/messages?page=${currentPage}&limit=50`);
      const data = await res.json();
      
      document.getElementById('currentGroupName').textContent = data.group.name;
      document.getElementById('messageCount').textContent = `${data.pagination.total} 条消息`;
      
      hasMore = data.pagination.has_more;
      
      const list = document.getElementById('messageList');
      
      const messagesHtml = data.messages.map(m => `
        <div class="message-item" data-id="${m.id}">
          <div class="message-avatar">${getAvatarLetter(m.sender)}</div>
          <div class="message-body">
            <div class="message-header">
              <span class="message-sender">${escapeHtml(m.sender)}</span>
              <span class="message-time">${m.time}</span>
            </div>
            <div class="message-content">${escapeHtml(m.content)}</div>
          </div>
        </div>
      `).join('');
      
      if (append) {
        // 移除旧的加载更多按钮
        const oldBtn = list.querySelector('.load-more-btn');
        if (oldBtn) oldBtn.remove();
        list.insertAdjacentHTML('beforeend', messagesHtml);
      } else {
        list.innerHTML = messagesHtml;
      }
      
      // 添加加载更多按钮
      if (hasMore) {
        list.insertAdjacentHTML('beforeend', `
          <button class="load-more-btn" onclick="loadMoreMessages()">加载更多</button>
        `);
      }
    }

    // 加载更多消息
    async function loadMoreMessages() {
      currentPage++;
      await loadMessages(true);
    }

    // 创建群组
    async function createGroup() {
      const name = document.getElementById('newGroupName').value.trim();
      if (!name) return;
      
      await fetch('/api/groups', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      
      hideAddGroupModal();
      await loadGroups();
    }

    // 删除群组
    async function deleteGroup(id, name) {
      if (!confirm(`确定要删除群组「${name}」吗？所有消息将被删除！`)) return;
      
      await fetch(`/api/groups/${id}`, { method: 'DELETE' });
      
      if (currentGroupId === id) {
        currentGroupId = null;
        document.getElementById('mainHeader').style.display = 'none';
        document.getElementById('messageList').innerHTML = `
          <div class="empty-state" id="emptyState">
            <div class="empty-state-icon">📭</div>
            <div class="empty-state-text">选择一个群组查看消息</div>
          </div>
        `;
      }
      
      await loadGroups();
    }

    // 显示/隐藏模态框
    function showAddGroupModal() {
      document.getElementById('addGroupModal').classList.add('active');
      document.getElementById('newGroupName').value = '';
      document.getElementById('newGroupName').focus();
    }

    function hideAddGroupModal() {
      document.getElementById('addGroupModal').classList.remove('active');
    }

    // 获取头像字母
    function getAvatarLetter(name) {
      if (!name) return '?';
      return name.charAt(0).toUpperCase();
    }

    // HTML转义
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 回车提交
    document.getElementById('newGroupName').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') createGroup();
      if (e.key === 'Escape') hideAddGroupModal();
    });

    // 初始化
    loadGroups();
  </script>
</body>
</html>
