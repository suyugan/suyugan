<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微信群聊截图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-dark: #0a0a0a;
      --bg-sidebar: #141414;
      --bg-card: #1e1e1e;
      --text-primary: #ffffff;
      --text-secondary: #888888;
      --wechat-green: #07c160;
      --border-color: #2a2a2a;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }
    .container { display: flex; height: 100vh; }
    .sidebar {
      width: 320px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-header h2 { font-size: 16px; font-weight: 600; }
    .btn {
      background: var(--wechat-green);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-danger { background: #dc3545; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }
    .btn-outline:hover { background: var(--bg-card); color: var(--text-primary); }
    .group-list { flex: 1; overflow-y: auto; padding: 12px; }
    .group-item {
      display: flex;
      align-items: center;
      padding: 14px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 6px;
      transition: background 0.2s;
    }
    .group-item:hover { background: var(--bg-card); }
    .group-item.active { background: var(--wechat-green); }
    .group-avatar {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-right: 12px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .group-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .group-info { flex: 1; min-width: 0; }
    .group-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .group-count { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-dark);
    }
    .main-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-sidebar);
    }
    .main-header h2 { font-size: 16px; font-weight: 600; }
    .header-actions { display: flex; gap: 10px; }
    .image-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-secondary);
    }
    .empty-state span { font-size: 48px; margin-bottom: 16px; }
    .latest-section { margin-bottom: 24px; }
    .section-title {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .latest-images {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .latest-image {
      flex-shrink: 0;
      width: calc((100% - 48px) / 4);
      min-width: 200px;
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg-card);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }
    .latest-image img { width: 100%; display: block; }
    .latest-image:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }
    .latest-image .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      background: rgba(0,0,0,0.7);
      border: none;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
      font-size: 18px;
    }
    .latest-image:hover .delete-btn { opacity: 1; }
    .history-section { margin-top: 24px; }
    .history-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
      color: var(--text-primary);
      font-size: 14px;
    }
    .history-toggle:hover { background: #252525; }
    .history-toggle .arrow { transition: transform 0.3s; font-size: 12px; }
    .history-toggle.expanded .arrow { transform: rotate(180deg); }
    .history-count {
      margin-left: auto;
      background: var(--wechat-green);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
    }
    .history-images {
      display: none;
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .history-images.show { display: grid; }
    .history-images.hide { display: none; }
    .history-image {
      border-radius: 10px;
      overflow: hidden;
      background: var(--bg-card);
      cursor: pointer;
      transition: transform 0.2s;
      position: relative;
    }
    .history-image:hover { transform: scale(1.02); }
    .history-image img { width: 100%; display: block; }
    .history-image .delete-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      background: rgba(0,0,0,0.7);
      border: none;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
      font-size: 14px;
    }
    .history-image:hover .delete-btn { opacity: 1; }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 28px;
      max-width: 440px;
      width: 90%;
    }
    .modal-content h3 { margin-bottom: 24px; font-size: 18px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 13px; }
    .form-group input {
      width: 100%;
      padding: 14px;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 15px;
    }
    .form-group input:focus { outline: none; border-color: var(--wechat-green); }
    .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 28px; }
    .preview-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 1001;
      align-items: center;
      justify-content: center;
    }
    .preview-modal.active { display: flex; }
    .preview-modal img { max-width: 95%; max-height: 95%; object-fit: contain; }
    .preview-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }
    .upload-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1002;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .upload-overlay.active { display: flex; }
    .upload-progress {
      width: 320px;
      height: 6px;
      background: var(--bg-card);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 20px;
    }
    .upload-progress-bar {
      height: 100%;
      background: var(--wechat-green);
      width: 0%;
      transition: width 0.3s;
    }
    .upload-text { color: var(--text-primary); font-size: 16px; }
    .mobile-toggle { display: none; }
    .drag-over {
      border: 3px dashed var(--wechat-green) !important;
      background: rgba(7, 193, 96, 0.1);
    }
    @media (max-width: 768px) {
      .sidebar { position: fixed; left: -100%; width: 100%; z-index: 100; transition: left 0.3s; }
      .sidebar.open { left: 0; }
      .mobile-toggle { display: block !important; padding: 8px 12px; }
      .latest-image { width: 300px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>群聊列表</h2>
        <button class="btn" onclick="showCreateGroup()">+ 新建</button>
      </div>
      <div class="group-list" id="groupList"></div>
    </aside>
    <main class="main">
      <div class="main-header">
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="btn mobile-toggle" onclick="toggleSidebar()">☰</button>
          <h2 id="currentGroupName">选择一个群聊</h2>
        </div>
        <div class="header-actions" id="headerActions" style="display:none;">
          <button class="btn" onclick="triggerUpload()">上传图片</button>
          <button class="btn btn-outline" onclick="showEditGroup()">编辑</button>
          <button class="btn btn-danger" onclick="deleteGroup()">删除</button>
        </div>
      </div>
      <div class="image-container" id="imageContainer">
        <div class="empty-state">
          <span>👆</span>
          <p>请从左侧选择或创建一个群聊</p>
        </div>
      </div>
    </main>
  </div>
  <div class="modal" id="groupModal">
    <div class="modal-content">
      <h3 id="modalTitle">创建新群聊</h3>
      <div class="form-group">
        <label>群名称</label>
        <input type="text" id="groupNameInput" placeholder="输入群名称">
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal()">取消</button>
        <button class="btn" onclick="saveGroup()">保存</button>
      </div>
    </div>
  </div>
  <div class="preview-modal" id="previewModal" onclick="closePreview()">
    <button class="preview-close">×</button>
    <img id="previewImage" src="">
  </div>
  <div class="upload-overlay" id="uploadOverlay">
    <div class="upload-text" id="uploadText">正在上传...</div>
    <div class="upload-progress">
      <div class="upload-progress-bar" id="uploadProgress"></div>
    </div>
  </div>
  <input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="handleUpload(this.files)">
<script>
let currentGroup = null;
let editingGroup = false;
let allImages = [];
const LATEST_COUNT = 4;

document.addEventListener('DOMContentLoaded', function() {
  loadGroups();
  setupDragDrop();
});

async function loadGroups() {
  try {
    const res = await fetch('api/groups');
    const groups = await res.json();
    const list = document.getElementById('groupList');
    if (groups.length === 0) {
      list.innerHTML = '<div class="empty-state" style="padding:40px;"><span>📭</span><p>还没有群聊<br>点击上方"新建"创建</p></div>';
      return;
    }
    list.innerHTML = groups.map(function(g) {
      return '<div class="group-item ' + (currentGroup && currentGroup.id === g.id ? 'active' : '') + '" onclick="selectGroup(\'' + g.id + '\')">' +
        '<div class="group-avatar">' + (g.avatar ? '<img src="' + g.avatar + '">' : g.name.charAt(0)) + '</div>' +
        '<div class="group-info">' +
          '<div class="group-name">' + escapeHtml(g.name) + '</div>' +
          '<div class="group-count">' + g.image_count + ' 张图片</div>' +
        '</div>' +
      '</div>';
    }).join('');
  } catch (e) {
    console.error('loadGroups error:', e);
  }
}

async function selectGroup(id) {
  try {
    const res = await fetch('api/groups');
    const groups = await res.json();
    currentGroup = groups.find(function(g) { return g.id === id; });
    if (!currentGroup) return;
    document.getElementById('currentGroupName').textContent = currentGroup.name;
    document.getElementById('headerActions').style.display = 'flex';
    document.getElementById('sidebar').classList.remove('open');
    loadAllImages();
    loadGroups();
  } catch (e) {
    console.error('selectGroup error:', e);
  }
}

async function loadAllImages() {
  if (!currentGroup) return;
  try {
    const res = await fetch('api/groups/' + currentGroup.id + '/images?page=1&limit=1000');
    const data = await res.json();
    allImages = data.images;
    renderImages();
  } catch (e) {
    console.error('loadAllImages error:', e);
  }
}

function renderImages() {
  const container = document.getElementById('imageContainer');
  if (allImages.length === 0) {
    container.innerHTML = '<div class="empty-state"><span>📷</span><p>还没有图片<br>点击上方"上传图片"或拖拽到此处</p></div>';
    return;
  }
  const latestImages = allImages.slice(0, LATEST_COUNT);
  const historyImages = allImages.slice(LATEST_COUNT);
  let html = '<div class="latest-section">' +
    '<div class="section-title">最新截图</div>' +
    '<div class="latest-images">' +
    latestImages.map(function(img) {
      return '<div class="latest-image" onclick="previewImage(\'' + img.url + '\')">' +
        '<img src="' + img.url + '" loading="lazy">' +
        '<button class="delete-btn" onclick="event.stopPropagation();deleteImage(\'' + img.id + '\')">×</button>' +
      '</div>';
    }).join('') +
    '</div></div>';
  if (historyImages.length > 0) {
    html += '<div class="history-section">' +
      '<button class="history-toggle" onclick="toggleHistory(this)">' +
        '<span class="arrow">▼</span>' +
        '<span>更早的截图</span>' +
        '<span class="history-count">' + historyImages.length + ' 张</span>' +
      '</button>' +
      '<div class="history-images hide" id="historyImages">' +
      historyImages.map(function(img) {
        return '<div class="history-image" onclick="previewImage(\'' + img.url + '\')">' +
          '<img src="' + img.url + '" loading="lazy">' +
          '<button class="delete-btn" onclick="event.stopPropagation();deleteImage(\'' + img.id + '\')">×</button>' +
        '</div>';
      }).join('') +
      '</div></div>';
  }
  container.innerHTML = html;
}

function toggleHistory(btn) {
  btn.classList.toggle('expanded');
  var images = document.getElementById('historyImages');
  images.classList.toggle('show');
  images.classList.toggle('hide');
}

function showCreateGroup() {
  editingGroup = false;
  document.getElementById('modalTitle').textContent = '创建新群聊';
  document.getElementById('groupNameInput').value = '';
  document.getElementById('groupModal').classList.add('active');
}

function showEditGroup() {
  if (!currentGroup) return;
  editingGroup = true;
  document.getElementById('modalTitle').textContent = '编辑群聊';
  document.getElementById('groupNameInput').value = currentGroup.name;
  document.getElementById('groupModal').classList.add('active');
}

async function saveGroup() {
  const name = document.getElementById('groupNameInput').value.trim();
  if (!name) return alert('请输入群名称');
  try {
    if (editingGroup && currentGroup) {
      await fetch('api/groups/' + currentGroup.id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name })
      });
    } else {
      const res = await fetch('api/groups', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name })
      });
      const newGroup = await res.json();
      currentGroup = newGroup;
      document.getElementById('currentGroupName').textContent = name;
      document.getElementById('headerActions').style.display = 'flex';
    }
    closeModal();
    loadGroups();
    if (currentGroup) loadAllImages();
  } catch (e) {
    console.error('saveGroup error:', e);
    alert('保存失败');
  }
}

async function deleteGroup() {
  if (!currentGroup) return;
  if (!confirm('确定删除群聊 "' + currentGroup.name + '" 及所有图片？')) return;
  try {
    await fetch('api/groups/' + currentGroup.id, { method: 'DELETE' });
    currentGroup = null;
    document.getElementById('currentGroupName').textContent = '选择一个群聊';
    document.getElementById('headerActions').style.display = 'none';
    document.getElementById('imageContainer').innerHTML = '<div class="empty-state"><span>👆</span><p>请从左侧选择或创建一个群聊</p></div>';
    loadGroups();
  } catch (e) {
    console.error('deleteGroup error:', e);
    alert('删除失败');
  }
}

function closeModal() {
  document.getElementById('groupModal').classList.remove('active');
}

function triggerUpload() {
  if (!currentGroup) return alert('请先选择群聊');
  document.getElementById('fileInput').click();
}

async function handleUpload(files) {
  if (!currentGroup || !files.length) return;
  const overlay = document.getElementById('uploadOverlay');
  const progressBar = document.getElementById('uploadProgress');
  const uploadText = document.getElementById('uploadText');
  overlay.classList.add('active');
  const formData = new FormData();
  for (let i = 0; i < files.length; i++) {
    formData.append('images', files[i]);
  }
  try {
    uploadText.textContent = '正在上传 ' + files.length + ' 张图片...';
    progressBar.style.width = '30%';
    const res = await fetch('api/groups/' + currentGroup.id + '/images', {
      method: 'POST',
      body: formData
    });
    progressBar.style.width = '100%';
    if (res.ok) {
      uploadText.textContent = '上传成功！';
      setTimeout(function() {
        overlay.classList.remove('active');
        progressBar.style.width = '0%';
        loadAllImages();
        loadGroups();
      }, 500);
    } else {
      throw new Error('Upload failed');
    }
  } catch (e) {
    console.error('handleUpload error:', e);
    uploadText.textContent = '上传失败';
    setTimeout(function() {
      overlay.classList.remove('active');
      progressBar.style.width = '0%';
    }, 1500);
  }
  document.getElementById('fileInput').value = '';
}

async function deleteImage(id) {
  if (!confirm('确定删除这张图片？')) return;
  try {
    await fetch('api/images/' + id, { method: 'DELETE' });
    loadAllImages();
    loadGroups();
  } catch (e) {
    console.error('deleteImage error:', e);
    alert('删除失败');
  }
}

function previewImage(url) {
  document.getElementById('previewImage').src = url;
  document.getElementById('previewModal').classList.add('active');
}

function closePreview() {
  document.getElementById('previewModal').classList.remove('active');
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function setupDragDrop() {
  const container = document.getElementById('imageContainer');
  container.addEventListener('dragover', function(e) {
    e.preventDefault();
    container.classList.add('drag-over');
  });
  container.addEventListener('dragleave', function(e) {
    e.preventDefault();
    container.classList.remove('drag-over');
  });
  container.addEventListener('drop', function(e) {
    e.preventDefault();
    container.classList.remove('drag-over');
    if (e.dataTransfer.files.length > 0) {
      handleUpload(e.dataTransfer.files);
    }
  });
}

function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closePreview();
    closeModal();
  }
});
</script>
</body>
</html>
