<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>芝麻组队工具</title>

    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind 配置 -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#007AFF',
              grayBtn: '#E5E5EA',
              textGray: '#8A8A8E',
              stepBlue: '#007AFF',
              greenBtn: '#06C160',
              cardBg: '#FFFFFF',
              bgPage: '#F5F5F7',
            },
            fontFamily: {
              apple: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
            },
          },
        },
      }
    </script>

    <!-- 引入 Font Awesome 图标 -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 引入 Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- 引入 Vue Router -->
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>

    <!-- 引入 Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body class="bg-bgPage font-apple max-w-[430px] mx-auto min-h-screen pb-[80px]">
    <div id="app">
      <style>
        .status-bar {
          @apply h-[40px] flex items-center justify-between px-4 text-black text-sm font-medium;
        }
        .nav-title {
          @apply text-[18px] font-semibold text-black;
        }
        .stat-card {
          @apply bg-white rounded-xl shadow-sm py-5 px-4 flex flex-col items-center justify-center;
        }
        .input-box {
          @apply w-full h-[50px] px-4 rounded-lg border border-gray-200 outline-none text-[15px] bg-white;
        }
        .btn-disabled {
          @apply w-full h-[52px] rounded-lg bg-grayBtn text-[#666] text-[17px] font-medium flex items-center justify-center;
        }
        .btn-blue {
          @apply w-full h-[52px] text-primary text-[17px] font-medium flex items-center justify-center;
        }
        .btn-green {
          @apply w-full h-[52px] text-greenBtn text-[17px] font-medium flex items-center justify-center;
        }
        .step-item {
          @apply flex items-start gap-3 mb-4;
        }
        .step-num {
          @apply w-[22px] h-[22px] rounded-full bg-stepBlue text-white text-[13px] flex items-center justify-center flex-shrink-0 mt-0.5;
        }
        .tabbar-item {
          @apply flex flex-col items-center justify-center gap-1 text-textGray text-[12px];
        }
        .tabbar-active {
          @apply text-primary font-medium;
        }
      </style>
    </div>

    <script>
      const { createApp, ref, computed, onMounted } = Vue;
      const { createRouter, createWebHistory } = VueRouter;

      // 创建路由
      const router = createRouter({
        history: createWebHistory('/'),
        routes: [
          { path: '/', component: Home },
          { path: '/match-pool', component: MatchPool },
          { path: '/find-score', component: FindScore },
          { path: '/profile', component: Profile }
        ]
      });

      // API
      const API_URL = 'http://localhost:5001/api';

      // 组件
      const StatusBar = {
        template: `
          <div class="status-bar">
            <div class="flex items-center gap-2">
              <i class="fa-solid fa-moon text-xs"></i>
              <span>7:20</span>
            </div>
            <div class="flex items-center gap-2">
              <i class="fa-solid fa-signal text-xs"></i>
              <i class="fa-solid fa-wifi text-xs"></i>
              <span>10</span>
              <i class="fa-solid fa-battery-half text-xs"></i>
            </div>
          </div>
        `
      };

      const StatCard = {
        props: ['value', 'label'],
        template: `
          <div class="stat-card">
            <span class="text-[28px] font-bold text-black">{{ value }}</span>
            <span class="text-[14px] text-textGray mt-1">{{ label }}</span>
          </div>
        `
      };

      const TabBar = {
        props: ['activeTab'],
        template: `
          <div class="fixed bottom-0 left-0 right-0 max-w-[430px] mx-auto bg-white border-t border-gray-200 h-[80px] flex items-center justify-around px-6">
            <div class="tabbar-item" :class="{ 'tabbar-active': activeTab === 'home' }">
              <i class="fa-solid fa-house text-[22px]"></i>
              <span>首页</span>
            </div>
            <div class="tabbar-item" :class="{ 'tabbar-active': activeTab === 'match' }">
              <i class="fa-solid fa-magnifying-glass text-[22px]"></i>
              <span>找分数</span>
            </div>
            <div class="tabbar-item" :class="{ 'tabbar-active': activeTab === 'profile' }">
              <i class="fa-solid fa-user text-[22px]"></i>
              <span>我的</span>
            </div>
          </div>
        `
      };

      // 首页组件
      const Home = {
        data() {
          return {
            tokenInput: '',
            stats: {
              totalTeams: 1057,
              totalTokens: 1480
            }
          };
        },
        methods: {
          async fetchStats() {
            try {
              const response = await axios.get(API_URL + '/stats');
              if (response.data.success) {
                this.stats = response.data.data;
              }
            } catch (error) {
              console.error('获取统计数据失败:', error);
            }
          }
        },
        mounted() {
          this.fetchStats();
        }
      };

      // 匹配池组件
      const MatchPool = {
        data() {
          return {
            isWaiting: false,
            isMatched: false,
            currentMatch: null
          };
        },
        methods: {
          async checkMatchStatus() {
            if (!this.currentMatch) return;

            try {
              const response = await axios.get(API_URL + '/match/status/' + this.currentMatch.matchId);
              if (response.data.success) {
                const data = response.data.data;
                if (data.status === 'completed') {
                  this.isWaiting = false;
                  this.isMatched = true;
                  this.currentMatch = data;
                }
              }
            } catch (error) {
              console.error('查询匹配状态失败:', error);
            }
          }
        },
        mounted() {
          // 模拟等待状态
          this.isWaiting = true;
          // 每5秒查询一次
          setInterval(() => {
            if (this.isWaiting) {
              this.checkMatchStatus();
            }
          }, 5000);
        }
      };

      // 找分数组件
      const FindScore = {
        data() {
          return {
            tokenInput: '',
            parsedData: null
          };
        },
        methods: {
          async parseToken() {
            if (!this.tokenInput) return;

            try {
              const response = await axios.post(API_URL + '/token/parse', {
                token: this.tokenInput
              });

              if (response.data.success) {
                this.parsedData = response.data.data;
              }
            } catch (error) {
              console.error('解析口令失败:', error);
            }
          }
        }
      };

      // 个人中心组件
      const Profile = {
        data() {
          return {
            userName: '游客',
            userId: '未登录',
            userTeams: []
          };
        },
        mounted() {
          // 模拟数据
          this.userTeams = [
            { id: '1', matchId: 'TEAM001', status: 'completed', totalScore: 2026 },
            { id: '2', matchId: 'TEAM002', status: 'completed', totalScore: 2026 }
          ];
        }
      };

      // 创建应用
      const app = createApp({
        components: {
          StatusBar,
          StatCard,
          TabBar
        },
        data() {
          return {
            currentTab: 'home',
            currentPage: 'Home'
          };
        }
      });

      app.use(router);

      app.mount('#app');
    </script>
  </body>
</html>
