<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>群聊消息</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;height:100vh;display:flex;flex-direction:column}
.header{background:#1a1a1a;padding:12px 16px;border-bottom:1px solid #333;display:flex;align-items:center;gap:12px;flex-shrink:0}
.header h1{font-size:16px;font-weight:600;flex:1}
.header .count{font-size:12px;color:#888}
.search-box{background:#2a2a2a;border:none;color:#e0e0e0;padding:8px 12px;border-radius:20px;width:200px;font-size:13px;outline:none}
.search-box:focus{background:#333}
.chat-container{flex:1;overflow-y:auto;padding:8px 12px;scroll-behavior:smooth}
.loading{text-align:center;padding:16px;color:#666;font-size:13px}
.time-sep{text-align:center;margin:16px 0 8px;font-size:11px;color:#666}
.time-sep span{background:#1a1a1a;padding:2px 12px;border-radius:10px}
.msg{display:flex;align-items:flex-start;margin:4px 0;padding:4px 0}
.msg.system{justify-content:center}
.msg.system .bubble{background:transparent;color:#666;font-size:12px;text-align:center;max-width:80%}
.avatar{width:36px;height:36px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;flex-shrink:0;margin-right:8px;margin-top:2px}
.msg-body{max-width:75%;min-width:0}
.sender-name{font-size:11px;color:#888;margin-bottom:2px;margin-left:4px}
.bubble{background:#2a2a2a;padding:8px 12px;border-radius:4px 12px 12px 12px;font-size:14px;line-height:1.5;word-break:break-word;position:relative}
.bubble img{max-width:240px;max-height:240px;border-radius:6px;cursor:pointer;display:block;margin:2px 0}
.bubble a{color:#5b9bd5;text-decoration:none}
.bubble a:hover{text-decoration:underline}
.msg-time{font-size:10px;color:#555;margin-top:2px;margin-left:4px}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:999;align-items:center;justify-content:center;cursor:pointer}
.lightbox.show{display:flex}
.lightbox img{max-width:95%;max-height:95%;object-fit:contain}
#load-more{text-align:center;padding:12px;color:#5b9bd5;cursor:pointer;font-size:13px;display:none}
@media(max-width:480px){
  .search-box{width:120px}
  .bubble img{max-width:180px;max-height:180px}
  .msg-body{max-width:82%}
}
</style>
</head>
<body>
<div class="header">
  <h1>💬 群聊消息</h1>
  <span class="count" id="msgCount"></span>
  <input class="search-box" id="searchBox" placeholder="搜索消息..." />
</div>
<div id="load-more" onclick="loadMore()">加载更多历史消息</div>
<div class="chat-container" id="chatBox"></div>
<div class="lightbox" id="lightbox" onclick="this.classList.remove('show')"><img id="lbImg"/></div>

<script>
const chatBox=document.getElementById('chatBox');
const searchBox=document.getElementById('searchBox');
const msgCount=document.getElementById('msgCount');
const loadMoreBtn=document.getElementById('load-more');
let currentPage=1,totalMessages=0,loading=false,searchQuery='';
let latestTimestamp=null;
let knownIds=new Set();
const COLORS=['#e74c3c','#3498db','#2ecc71','#e67e22','#9b59b6','#1abc9c','#f39c12','#e84393','#00cec9','#6c5ce7','#fd79a8','#00b894'];

function hashColor(name){
  let h=0;for(let i=0;i<name.length;i++)h=name.charCodeAt(i)+((h<<5)-h);
  return COLORS[Math.abs(h)%COLORS.length];
}

function formatTime(ts){
  if(!ts)return '';
  const d=new Date(ts);
  if(isNaN(d))return ts;
  const now=new Date();
  const isToday=d.toDateString()===now.toDateString();
  const h=String(d.getHours()).padStart(2,'0');
  const m=String(d.getMinutes()).padStart(2,'0');
  return isToday?`${h}:${m}`:`${d.getMonth()+1}/${d.getDate()} ${h}:${m}`;
}

function timeSepLabel(ts){
  if(!ts)return null;
  const d=new Date(ts);
  if(isNaN(d))return null;
  const now=new Date();
  if(d.toDateString()===now.toDateString())return '今天';
  const y=now.getTime()-d.getTime();
  if(y<86400000*2)return '昨天';
  return `${d.getMonth()+1}月${d.getDate()}日`;
}

function renderMsg(m){
  if(m.msg_type==='system'){
    return `<div class="msg system"><div class="bubble">${esc(m.content)}</div></div>`;
  }
  const color=hashColor(m.sender||'?');
  const initial=(m.sender||'?')[0];
  let content='';
  if(m.msg_type==='image'&&m.media_url){
    content=`<img src="${esc(m.media_url)}" onclick="showImg(this.src)" loading="lazy" alt="图片"/>`;
    if(m.content&&m.content!=='[图片]')content+=`<div style="margin-top:4px;font-size:12px;color:#888">${esc(m.content)}</div>`;
  } else if(m.msg_type==='link'){
    const urlMatch=m.content&&m.content.match(/(https?:\/\/\S+)/);
    content=urlMatch?`<a href="${esc(urlMatch[0])}" target="_blank">${esc(m.content)}</a>`:esc(m.content);
  } else {
    content=esc(m.content||'').replace(/(https?:\/\/\S+)/g,'<a href="$1" target="_blank">$1</a>');
  }
  return `<div class="msg">
    <div class="avatar" style="background:${color}">${esc(initial)}</div>
    <div class="msg-body">
      <div class="sender-name">${esc(m.sender||'未知')}</div>
      <div class="bubble" style="border-color:${color}">${content}</div>
      <div class="msg-time">${formatTime(m.timestamp)}</div>
    </div></div>`;
}

function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}

function showImg(src){
  document.getElementById('lbImg').src=src;
  document.getElementById('lightbox').classList.add('show');
}

let lastTimeSep='';
function addTimeSeps(messages,container,prepend){
  let html='';
  for(const m of messages){
    const sep=timeSepLabel(m.timestamp);
    if(sep&&sep!==lastTimeSep){
      lastTimeSep=sep;
      html+=`<div class="time-sep"><span>${sep}</span></div>`;
    }
    html+=renderMsg(m);
  }
  if(prepend)container.insertAdjacentHTML('afterbegin',html);
  else container.insertAdjacentHTML('beforeend',html);
}

function trackMessages(messages){
  for(const m of messages){
    knownIds.add(m.id);
    if(m.timestamp && (!latestTimestamp || m.timestamp > latestTimestamp)){
      latestTimestamp=m.timestamp;
    }
  }
}

async function loadMessages(page=1,prepend=false){
  if(loading)return;loading=true;
  try{
    const params=new URLSearchParams({page,limit:50});
    if(searchQuery)params.set('search',searchQuery);
    const r=await fetch(`api/messages?${params}`);
    const data=await r.json();
    totalMessages=data.total;
    msgCount.textContent=`${totalMessages}条消息`;
    if(!prepend){chatBox.innerHTML='';lastTimeSep='';knownIds.clear();latestTimestamp=null;}
    if(data.messages.length){
      addTimeSeps(data.messages,chatBox,prepend);
      trackMessages(data.messages);
    }
    const totalPages=Math.ceil(totalMessages/50);
    loadMoreBtn.style.display=page<totalPages?'block':'none';
    return data;
  }catch(e){
    console.error('loadMessages error:',e);
  }finally{
    loading=false;
  }
}

async function init(){
  const params=new URLSearchParams({page:1,limit:1});
  const r=await fetch(`api/messages?${params}`);
  const{total}=await r.json();
  const lastPage=Math.max(1,Math.ceil(total/50));
  currentPage=lastPage;
  await loadMessages(lastPage);
  chatBox.scrollTop=chatBox.scrollHeight;
  if(lastPage>1)loadMoreBtn.style.display='block';
}

async function loadMore(){
  if(currentPage<=1)return;
  const scrollH=chatBox.scrollHeight;
  currentPage--;
  await loadMessages(currentPage,true);
  chatBox.scrollTop=chatBox.scrollHeight-scrollH;
  if(currentPage<=1)loadMoreBtn.style.display='none';
}

// Incremental refresh: only fetch messages newer than the latest displayed one
async function refreshNewMessages(){
  if(loading||searchQuery)return;
  loading=true;
  try{
    const params=new URLSearchParams({limit:200});
    if(latestTimestamp) params.set('after',latestTimestamp);
    const r=await fetch(`api/messages?${params}`);
    const data=await r.json();
    totalMessages=data.total;
    msgCount.textContent=`${totalMessages}条消息`;
    const newMsgs=data.messages.filter(m=>!knownIds.has(m.id));
    if(newMsgs.length){
      const wasAtBottom=chatBox.scrollHeight-chatBox.scrollTop-chatBox.clientHeight<50;
      addTimeSeps(newMsgs,chatBox,false);
      trackMessages(newMsgs);
      if(wasAtBottom) chatBox.scrollTop=chatBox.scrollHeight;
    }
  }catch(e){
    console.error('refreshNewMessages error:',e);
  }finally{
    loading=false;
  }
}

let searchTimer;
searchBox.addEventListener('input',()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(async()=>{
    searchQuery=searchBox.value.trim();
    currentPage=1;lastTimeSep='';
    const data=await loadMessages(1);
    if(!searchQuery){
      const lastPage=Math.max(1,Math.ceil(totalMessages/50));
      currentPage=lastPage;
      await loadMessages(lastPage);
    }
    chatBox.scrollTop=chatBox.scrollHeight;
  },500);
});

init();
// Auto-refresh: incrementally append new messages only
setInterval(refreshNewMessages,15000);
</script>
</body>
</html>
